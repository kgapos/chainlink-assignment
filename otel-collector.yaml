receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: vechain-node
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["node-a:2112", "node-b:2112"]
        - job_name: tempo
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["tempo:3200"]
        - job_name: envoy
          scrape_interval: 15s
          metrics_path: /stats/prometheus
          static_configs:
            - targets: ["envoy:9901"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [prometheus, otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
