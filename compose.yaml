name: otel
services:
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
    networks:
      - observability

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability

  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - observability

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    command: -config.file=/etc/promtail/promtail.yaml
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - ./promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks:
      - observability

  tempo:
    image: grafana/tempo:2.6.1
    user: "0:0"
    container_name: tempo
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - observability

  # Telemetry generating applications:
  node-volume-init:
    image: alpine:3.19
    container_name: node-volume-init
    user: "0:0"
    environment:
      - USE_SNAPSHOT=${USE_SNAPSHOT:-true} # Use a snapshot to reduce the node's initial sync time from days to minutes. Expects a directory with the snapshot files configured in SNAPSHOT_PATH.
    command: ["/bin/sh", "/scripts/copy-snapshots.sh"]
    volumes:
      - ./scripts/copy-snapshots.sh:/scripts/copy-snapshots.sh:ro
      - node_data_a:/node_data_a
      - node_data_b:/node_data_b
      - ${SNAPSHOT_PATH:-/storage/prd-node-snapshots/node-hosting/testnet}:/snapshot:ro # Replace with your own snapshot path
    networks:
      - observability

  node-a:
    image: vechain/thor:v2.4.1
    container_name: node-a
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - node_data_a:/home/thor/.org.vechain.thor
    expose:
      - "80"
      - "2112"
      - "2113"
      - "11235"
    entrypoint: thor
    command:
      - --network=testnet
      - --max-peers=300
      - --enable-metrics
      - --metrics-addr=0.0.0.0:2112
      - --enable-admin
      - --admin-addr=0.0.0.0:2113
      - --enable-api-logs
      - --txpool-limit-per-account=10000
      - --api-addr=0.0.0.0:80
      - --api-cors=*
      - --api-enable-deprecated
      - --api-allowed-tracers=call
      - --api-log-5xx-errors
      - --api-slow-queries-threshold=5000
      - --disable-pruner
      - --logdb-additional-indexes
    depends_on:
      node-volume-init:
        condition: service_completed_successfully
    networks:
      - observability

  node-b:
    image: vechain/thor:v2.4.1
    container_name: node-b
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - node_data_b:/home/thor/.org.vechain.thor
    expose:
      - "80"
      - "2112"
      - "2113"
      - "11235"
    entrypoint: thor
    command:
      - --network=testnet
      - --max-peers=300
      - --enable-metrics
      - --metrics-addr=0.0.0.0:2112
      - --enable-admin
      - --admin-addr=0.0.0.0:2113
      - --enable-api-logs
      - --txpool-limit-per-account=10000
      - --api-addr=0.0.0.0:80
      - --api-cors=*
      - --api-enable-deprecated
      - --api-allowed-tracers=call
      - --api-log-5xx-errors
      - --api-slow-queries-threshold=5000
      - --disable-pruner
      - --logdb-additional-indexes
    depends_on:
      node-volume-init:
        condition: service_completed_successfully
    networks:
      - observability

  envoy:
    image: envoyproxy/envoy:v1.30.7
    container_name: envoy
    ports:
      - "80:80"
    expose:
      - "9901"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "-l", "info"]
    depends_on:
      - node-a
      - node-b
      - otel-collector
    networks:
      - observability

  k6:
    image: grafana/k6:0.49.0
    container_name: k6
    environment:
      - BASE_URL=http://envoy:80
      - TEST_PROFILE=smoke
    volumes:
      - ./k6:/scripts:ro
    command: ["run", "/scripts/run.js"]
    depends_on:
      - envoy
    networks:
      - observability

volumes:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  node_data_a:
  node_data_b:

networks:
  observability:
    driver: bridge
