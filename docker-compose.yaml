services:
  node:
    image: vechain/thor:v2.4.1
    container_name: node
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - thor_data:/home/thor/.org.vechain.thor
    ports:
      - "80:80"
      - "2112:2112"
      - "2113:2113"
      - "11235:11235"
      - "11235:11235/udp"
    entrypoint: thor
    command:
      - --network=testnet
      - --max-peers=300
      - --enable-metrics
      - --metrics-addr=0.0.0.0:2112
      - --enable-admin
      - --admin-addr=0.0.0.0:2113
      - --txpool-limit-per-account=10000
      - --api-addr=0.0.0.0:80
      - --api-cors=*
      - --api-enable-deprecated
      - --api-allowed-tracers=call
      - --api-log-5xx-errors
      - --api-slow-queries-threshold=5000
      - --disable-pruner
      - --logdb-additional-indexes
    depends_on:
      thor-init:
        condition: service_completed_successfully
    networks:
      - observability

  thor-init:
    image: alpine:3.19
    command: ["sh", "-c", "chown -R 1000:1000 /home/thor/.org.vechain.thor"]
    user: "0:0"
    volumes:
      - thor_data:/home/thor/.org.vechain.thor
    networks:
      - observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
    networks:
      - observability

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability

  loki:
    image: grafana/loki:2.9.4
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - observability

  promtail:
    image: grafana/promtail:2.9.4
    command: -config.file=/etc/promtail/promtail.yaml
    volumes:
      - ./promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks:
      - observability

  tempo:
    image: grafana/tempo:2.4.1
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - observability

  trace-sidecar:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    command:
      - traces
      - --otlp-endpoint=otel-collector:4317
      - --otlp-insecure
      - --service=trace-sidecar
      - --rate=5
    depends_on:
      - otel-collector
    networks:
      - observability

volumes:
  thor_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:

networks:
  observability:
    driver: bridge
